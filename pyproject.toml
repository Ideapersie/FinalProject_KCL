[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag_adaptive"
version = "0.1.0"
description = "Adaptive Gating Policies for Offline Medical RAG — KCL MSc AI Variant 5"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}

dependencies = [
    # LLM inference (CPU-only GGUF)
    "llama-cpp-python>=0.3.19",
    # Retrieval
    "rank-bm25>=0.2.2",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.6.0",
    # Data loading
    "datasets>=2.14.0",
    "huggingface-hub>=0.22.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    # Profiling / energy
    "codecarbon>=2.4.0",
    "psutil>=5.9.0",
    # Numerics / evaluation
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # UI
    "gradio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]
openai = [
    "openai>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests that require real GGUF model files (deselect with '-m not slow')",
]
addopts = "-v --tb=short"
