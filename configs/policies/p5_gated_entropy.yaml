policy:
  name: p5_gated
  description: "Training-free gating, 3-gate ensemble (entropy + margin + hallucination probe), majority vote."
  retrieval_mode: hybrid
  cite_sources: false

# Canonical P5 config. gate.type=ensemble inherits ensemble_members /
# ensemble_min_votes / thresholds from base.yaml. The low tier overrides
# gate.type to hallucination_probe (probe-only) via hardware_low.yaml.
gate:
  type: ensemble
  entropy_threshold: 2.5        # nats; tuned via threshold sweep (Sprint 4)
  margin_threshold: 0.3
  draft_max_tokens: 48
